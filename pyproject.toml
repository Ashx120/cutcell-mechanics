[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "immersed-elasticity"
version = "0.3.0"
description = "CutCell Mechanics: verified immersed elasticity, viscoplasticity, and moment-fitted quadrature"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Shrey Gupta"}]
keywords = ["finite-elements", "computational-mechanics", "viscoplasticity", "quadrature", "moment-fitting"]
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "scipy>=1.11", "matplotlib>=3.8"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.urls]
Repository = "https://github.com/Ashx120/cutcell-mechanics"
Issues = "https://github.com/Ashx120/cutcell-mechanics/issues"
Documentation = "https://github.com/Ashx120/cutcell-mechanics#readme"
Changelog = "https://github.com/Ashx120/cutcell-mechanics/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
