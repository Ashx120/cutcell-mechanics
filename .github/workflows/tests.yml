name: Verification
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: verification-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    timeout-minutes: 15
    env:
      MPLBACKEND: Agg
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e '.[dev]'
      - run: python -m pip check
      - run: python -m pytest -q
  package:
    name: Build and import wheel
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip wheel --no-deps --wheel-dir dist .
      - run: python -m pip install dist/*.whl
      - name: Import installed package outside the checkout
        working-directory: ${{ runner.temp }}
        run: python -c "from immersed_elasticity.nonlinear_solver import NonlinearModel; from immersed_elasticity.thermal import solve_stationary_heat; from immersed_elasticity.thermal_settings import thermal_settings; from immersed_elasticity.viscoplasticity import J2Material; print(J2Material()); print(thermal_settings()['supports'])"
