name: Feature proposal
description: Suggest a numerical extension, example, or usability improvement.
title: "[Proposal] "
body:
  - type: textarea
    id: need
    attributes:
      label: Problem or use case
      description: Describe the analysis or workflow you want to support.
    validations:
      required: true
  - type: textarea
    id: approach
    attributes:
      label: Proposed approach and verification
      description: For numerical extensions, identify assumptions, equations, and a suitable reference problem.
    validations:
      required: true
